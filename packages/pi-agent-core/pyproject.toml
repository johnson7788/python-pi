[project]
name = "pi-agent-core"
version = "0.1.0"
description = "Agent runtime with tool calling and state management — Python port of @earendil-works/pi-agent-core"
requires-python = ">=3.11"
dependencies = [
    "pi-ai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_agent"]
