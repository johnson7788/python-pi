[project]
name = "pi-ai"
version = "0.1.0"
description = "Unified multi-provider LLM API — Python port of @earendil-works/pi-ai"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_ai"]
