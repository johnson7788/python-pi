[project]
name = "pi-coding-agent"
version = "0.1.0"
description = "Coding agent harness — Python port of @earendil-works/pi-coding-agent"
requires-python = ">=3.11"
dependencies = [
    "pi-ai",
    "pi-agent-core",
    "pyyaml>=6.0",
]

[project.scripts]
pi-py = "pi_coding_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_coding_agent"]
