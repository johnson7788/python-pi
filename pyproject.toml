[project]
name = "saas-workbuddy"
version = "0.1.0"
description = "Python port of the pi coding-agent harness (uv workspace root)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pi-ai",
    "pi-agent-core",
    "pi-coding-agent",
    "pi-server",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pi-ai = { workspace = true }
pi-agent-core = { workspace = true }
pi-coding-agent = { workspace = true }
pi-server = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Only for the sandbox provisioner's tests: they drive the docker daemon directly to
    # prove a sandbox really is one. The server itself never imports it.
    "docker>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::RuntimeWarning"]
markers = [
    "integration: needs external infrastructure (a docker daemon); skipped unless present",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# Build outputs, the frontend (eslint's job) and vendored trees are not Python lint targets.
extend-exclude = ["web", "office", "office-dist", "apps", "examples", "template", "docs/tutorials", "citexs-advanced"]

[tool.ruff.lint]
# Start from the rules that catch real defects.  Style rules can be ratcheted up
# later; a lint gate that people routinely bypass is worse than a narrow one.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# A pytest fixture parameter legitimately shadows the imported fixture name, and a
# test may keep a value only for its side effect.  Neither is a defect.
"tests/*" = ["F811", "F841"]
