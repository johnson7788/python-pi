  function addSlide(){
    snapshot();
    DECK.slides.push({ kind:'bul', kicker:String(DECK.slides.length + 1).padStart(2,'0'), title:'新页面', items:['单击这里的文字开始编辑'] });
    art.index = DECK.slides.length - 1;
    art.dirty = true;
    renderArt();
    toast('已插入一页');
  }
  function deleteSlide(){
    if (DECK.slides.length <= 1){ toast('至少保留一页'); return; }
    snapshot();
    DECK.slides.splice(art.index, 1);
    art.index = Math.max(0, art.index - 1);
    art.dirty = true;
    renderArt();
    toast('已删除当前页');
  }
  function scaleFont(delta){
    const next = Math.min(1.5, Math.max(0.75, Math.round((art.scale + delta) * 100) / 100));
    if (next === art.scale) return;
    art.scale = next;
    art.dirty = true;
    renderArt();
  }
  function setZoom(delta){
    art.zoom = Math.min(80, Math.max(22, art.zoom + delta));
    renderArt();
  }

  function renderArt(){
    $('#artTabName').textContent = DECK.name;
    $('#artName').textContent = DECK.name;
    renderThumbs();
    const s = DECK.slides[art.index];
    const wrap = $('#artSlideWrap');
    wrap.innerHTML = slideHTML(s);
    wrap.querySelectorAll('[data-edit]').forEach(node => {
      node.addEventListener('focus', () => snapshot());
      node.addEventListener('input', () => applyEdit(node));
      node.addEventListener('keydown', (e) => { if (e.key === 'Enter' && node.tagName !== 'LI'){ e.preventDefault(); node.blur(); } });
    });
    $('#artPos').textContent = `第 ${art.index + 1} 页 / 共 ${DECK.slides.length} 页`;
    $('#artDirty').hidden = !art.dirty;
    $('#artTab').classList.toggle('is-dirty', art.dirty);
    $('#artZoom').textContent = `${art.zoom}%`;
    $('#artNotes').value = DECK.slides[art.index].notes || '';
    const active = $('#artThumbs').children[art.index];
    if (active) active.scrollIntoView({ block: 'nearest' });
  }

  $('#artSave').addEventListener('click', saveDoc);
  $('#artToolSave').addEventListener('click', saveDoc);
  $('#artUndoBtn').addEventListener('click', undo);
  $('#artNotes').addEventListener('input', (e) => {
    DECK.slides[art.index].notes = e.target.value;
    art.dirty = true;
    $('#artTab').classList.add('is-dirty');
  });
  document.addEventListener('click', (e) => {
    const hit = e.target.closest('[data-artifact]');
    if (hit){ e.preventDefault(); openArtifact(); }
  });
  $('#artifactPane').addEventListener('click', (e) => {
    const tool = e.target.closest('[data-art]');
    if (!tool) return;
    const act = tool.dataset.art;
    if (act === 'undo') undo();
    else if (act === 'redo') redo();
    else if (act === 'add') addSlide();
    else if (act === 'delete') deleteSlide();
    else if (act === 'font-up') scaleFont(0.1);
    else if (act === 'font-down') scaleFont(-0.1);
    else if (act === 'zoom-in') setZoom(5);
    else if (act === 'zoom-out') setZoom(-5);
  });

  (function artResize(){
    const handle = $('#artResize');
    let on = false;
    handle.addEventListener('pointerdown', (e) => {
      on = true;
      handle.setPointerCapture(e.pointerId);
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });
    window.addEventListener('pointermove', (e) => {
      if (!on) return;
      const w = Math.max(380, Math.min(innerWidth - e.clientX, innerWidth * 0.8));
      document.documentElement.style.setProperty('--art-w', w + 'px');
    });
    window.addEventListener('pointerup', () => {
      on = false;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      scrollBottom();
    });
  })();

  /* ───────── boot ───────── */
  renderTasks();
  renderSpaces();
  renderWsList();
  renderArt();
  renderQuick();
  renderSchedules();
  renderFiles();
  syncSend();
  const initialWs = WORKSPACES.find(w => w.id === state.ws);
  $('#wsBtn span').textContent = initialWs.name;
  $('#chatWs').textContent = initialWs.name;
  $('#wsIcon use').setAttribute('href', initialWs.kind === 'default' ? '#i-house' : '#i-folder');
  $('#chatWsIcon use').setAttribute('href', initialWs.kind === 'default' ? '#i-house' : '#i-folder');
  setTimeout(() => $('#homeInput').focus(), 260);
})();
</script>
</body>
</html>
