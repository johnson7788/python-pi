name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the workspace
        run: uv sync --frozen --all-packages
      - name: Lint
        # Pinned and installed outside the project env: ruff stays out of uv.lock
        # so a lint-only change never needs a dependency re-resolution.
        run: uvx ruff@0.17.6 check .
      - name: Format check (non-blocking)
        # The repo has 126 unformatted files from before this gate existed.
        # Blocking on them now would bury every real change in a mechanical diff;
        # the plan is to format directories as they are touched.
        continue-on-error: true
        run: uvx ruff@0.17.6 format --check .
      - name: Tests
        # ``PI_REQUIRE_INTEGRATION`` stays unset: the docker-backed sandbox tests
        # skip, and their availability is a separate job below.
        run: uv run pytest -q

  integration:
    # Real containers, so this job is allowed to fail without blocking a review:
    # the point is to have the infrastructure-backed suite run somewhere at all.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - name: Docker-backed tests
        env:
          PI_REQUIRE_INTEGRATION: "1"
        run: uv run pytest -q -m integration

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Stream reducer tests
        run: npm run verify:reducer
